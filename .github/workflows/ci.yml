name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Pester unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser
          Invoke-Pester -Path tests/IisRelease.Tests.ps1 -CI -Output Detailed

  iis:
    name: Real IIS deploy and rollback (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: ./tests/integration.ps1

  pipeline:
    name: Azure DevOps pipeline check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml && python scripts/check_pipeline.py

  terraform:
    name: Terraform fmt, validate and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive terraform
      - run: |
          for d in azure aws; do
            (cd terraform/$d && terraform init -backend=false -input=false && terraform validate)
          done
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: '1'
